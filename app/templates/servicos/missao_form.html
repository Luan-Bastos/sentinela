{% extends "base.html" %}
{% block titulo %}Nova missão — Sentinela{% endblock %}
{% block trilha %}Principal &gt; Pessoal &gt; Serviços &gt; Previsão Diária &gt; Nova missão{% endblock %}

{% block conteudo %}
<div class="painel">
  <div class="painel-cabecalho"><h2>Nova missão — {{ dia.strftime('%d/%m/%Y') }}</h2></div>
  <form method="POST" class="form-ficha">
    <div class="campo">
      <label for="local">Local</label>
      <input type="text" id="local" name="local" required>
    </div>
    <div class="campo">
      <label for="militar_id">Militar</label>
      <select id="militar_id" name="militar_id" required>
        {% for mi in militares %}
        <option value="{{ mi.id }}">{{ mi.identificacao }} — {{ mi.unidade.sigla }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-acoes">
      <button type="submit" class="botao botao-primario">Salvar</button>
      <a href="{{ url_for('servicos.previsao_diaria', data=dia.isoformat()) }}" class="botao botao-secundario">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
